name: Windows portable runtime package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-portable-package.yml'
      - 'engine/**'
      - 'frontend/**'
      - 'prototype/**'
      - 'packaging/windows/**'
      - 'README.md'

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and verify portable runtime
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $BuildLog = Join-Path $env:RUNNER_TEMP 'btl-portable-build.log'
          try {
            ./packaging/windows/build.ps1 *>&1 | Tee-Object -FilePath $BuildLog
            if ($LASTEXITCODE -ne 0) { throw "Portable build exited with code $LASTEXITCODE." }
          } catch {
            $Detail = (Get-Content $BuildLog -Tail 40 -ErrorAction SilentlyContinue) -join ' | '
            if ($Detail) {
              $Detail = $Detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Portable build failure details::$Detail"
            }
            throw
          }
      - name: Verify install-update-uninstall data preservation
        shell: pwsh
        run: ./packaging/windows/test-lifecycle.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BoitierTiktokLive-win-x64-portable
          path: dist/BoitierTiktokLive-win-x64-portable.zip
          if-no-files-found: error
